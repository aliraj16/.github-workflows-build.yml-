          package com.maya.ai

          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL

          /** Google Gemini REST API ক্লায়েন্ট (নিজের API key দিয়ে)। */
          object GeminiClient {

              /** JSON আউটপুট চেয়ে একবার কল করে প্রথম টেক্সট রিটার্ন করে। ব্যাকগ্রাউন্ড থ্রেডে চালাতে হবে। */
              fun generate(apiKey: String, model: String, system: String, user: String): String {
                  val url = URL("https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent")
                  val conn = url.openConnection() as HttpURLConnection
                  try {
                      conn.requestMethod = "POST"
                      conn.connectTimeout = 20_000
                      conn.readTimeout = 60_000
                      conn.doOutput = true
                      conn.setRequestProperty("Content-Type", "application/json")
                      conn.setRequestProperty("x-goog-api-key", apiKey)

                      val body = JSONObject()
                          .put(
                              "systemInstruction",
                              JSONObject().put("parts", JSONArray().put(JSONObject().put("text", system)))
                          )
                          .put(
                              "contents",
                              JSONArray().put(
                                  JSONObject().put("role", "user")
                                      .put("parts", JSONArray().put(JSONObject().put("text", user)))
                              )
                          )
                          .put(
                              "generationConfig",
                              JSONObject().put("responseMimeType", "application/json").put("temperature", 0.2)
                          )

                      conn.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }

                      val code = conn.responseCode
                      val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                      val text = stream?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: ""
                      if (code !in 200..299) throw IOException("Gemini HTTP $code: ${text.take(300)}")

                      return JSONObject(text)
                          .getJSONArray("candidates").getJSONObject(0)
                          .getJSONObject("content").getJSONArray("parts")
                          .getJSONObject(0).getString("text")
                  } finally {
                      conn.disconnect()
                  }
              }
          }
